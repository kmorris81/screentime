[package]
name = "screentime"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Screen-time limits for a KDE Plasma (Wayland) kid account"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "sync"] }
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
