<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (screentimed) may own the name. -->
  <policy user="root">
    <allow own="org.screentime.Daemon1"/>
  </policy>
  <!-- Anyone may call it; the daemon checks callers itself (root-only bonus,
       heartbeats only from the agent binary). -->
  <policy context="default">
    <allow send_destination="org.screentime.Daemon1"/>
  </policy>
</busconfig>
