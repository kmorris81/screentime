# Pushing a tag vX.Y.Z (matching Cargo.toml) builds static x86_64 Linux
# binaries, publishes them as a GitHub release, and points release.json on
# master at the tarball so the NixOS module installs it instead of compiling.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable

      - run: cargo test --locked

      # musl gives fully static binaries, which run on NixOS as they are.
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          name=screentime-$VERSION-x86_64-linux
          mkdir -p "$name/bin" "$name/share/dbus-1/system.d"
          for bin in screentime screentimed screentime-agent; do
            install -m755 -s "target/x86_64-unknown-linux-musl/release/$bin" "$name/bin/"
          done
          install -m644 dbus/org.screentime.Daemon1.conf "$name/share/dbus-1/system.d/"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -czf "$name.tar.gz" "$name"
          echo "TARBALL=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$TARBALL" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Point release.json at it
        run: |
          hash="sha256-$(openssl dgst -sha256 -binary "$TARBALL" | base64)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$TARBALL"
          git fetch --depth=1 origin master
          git checkout -B master origin/master
          printf '{\n  "version": "%s",\n  "url": "%s",\n  "hash": "%s"\n}\n' \
            "$VERSION" "$url" "$hash" > release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.json
          git commit -m "release.json: $GITHUB_REF_NAME"
          git push origin master
